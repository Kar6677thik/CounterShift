# Local development dependencies. Start with:
#   docker compose -f deploy/compose/docker-compose.yml up -d
# Prometheus http://localhost:59090 · Grafana http://localhost:53000 (dashboard "CounterShift: migration")
name: countershift

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: countershift
      POSTGRES_PASSWORD: countershift   # local-only; real secrets come from GitHub/K8s (spec §11.4)
      POSTGRES_DB: countershift
    ports:
      # 55432 on the host avoids clashing with any Postgres you already run on 5432.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U countershift -d countershift"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Append-only file, fsync once per second: at most ~1 s of increments can be lost if the machine
    # crashes. The same setting is used in production (ADR 0008).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "56379:6379"   # non-default host port, as with Postgres
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver          # the API pushes metrics here (ADR 0014)
      - --storage.tsdb.retention.time=15d
    ports:
      - "59090:9090"   # the API (running on the host) pushes to http://localhost:59090/api/v1/otlp/v1/metrics
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # local only: no login screen
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/countershift.json
    ports:
      - "53000:3000"   # http://localhost:53000
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  pgdata:
  redisdata:
  promdata:
