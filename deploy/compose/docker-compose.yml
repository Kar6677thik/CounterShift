# Local development dependencies. Start with:
#   docker compose -f deploy/compose/docker-compose.yml up -d
# Prometheus and Grafana join this file in M7.
name: countershift

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: countershift
      POSTGRES_PASSWORD: countershift   # local-only; real secrets come from GitHub/K8s (spec §11.4)
      POSTGRES_DB: countershift
    ports:
      # 55432 on the host avoids clashing with any Postgres you already run on 5432.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U countershift -d countershift"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Append-only file, fsync once per second: at most ~1 s of increments can be lost if the machine
    # crashes. The same setting is used in production (ADR 0008).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "56379:6379"   # non-default host port, as with Postgres
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
