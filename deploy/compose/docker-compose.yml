# The full local stack. Start with:
#   docker compose -f deploy/compose/docker-compose.yml up -d --build      # API on http://localhost:8080
# For development, start only the dependencies and run the API from source:
#   docker compose -f deploy/compose/docker-compose.yml up -d postgres redis prometheus grafana
# Prometheus http://localhost:59090 · Grafana http://localhost:53000 (dashboard "CounterShift: migration")
name: countershift

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: countershift
      POSTGRES_PASSWORD: countershift   # local-only; real secrets come from GitHub/K8s (spec §11.4)
      POSTGRES_DB: countershift
    ports:
      # 55432 on the host avoids clashing with any Postgres you already run on 5432.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U countershift -d countershift"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Append-only file, fsync once per second: at most ~1 s of increments can be lost if the machine
    # crashes. The same setting is used in production (ADR 0008).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "56379:6379"   # non-default host port, as with Postgres
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: src/CounterShift.Api/Dockerfile
    image: countershift-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # No Kerberos here: without this, Npgsql probes for libgssapi (absent from the slim runtime image) and logs an error.
      ConnectionStrings__Postgres: Host=postgres;Database=countershift;Username=countershift;Password=countershift;GSS Encryption Mode=Disable
      ConnectionStrings__Redis: redis:6379
      # The storage mode is a watched file: edit deploy/compose/mode/storage-mode.json and the running API switches.
      COUNTERSHIFT_STORAGE_MODE_FILE: /config/storage-mode.json
      # File-change events don't cross a Windows/macOS bind mount into the container; poll instead.
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics
    volumes:
      # A directory, not a single file: editors replace files on save, and a single-file bind mount keeps
      # pointing at the old copy. (Kubernetes ConfigMaps have the same trap with subPath.)
      - ./mode:/config:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver          # the API pushes metrics here (ADR 0014)
      - --storage.tsdb.retention.time=15d
    ports:
      - "59090:9090"   # the API (running on the host) pushes to http://localhost:59090/api/v1/otlp/v1/metrics
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # local only: no login screen
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/countershift.json
    ports:
      - "53000:3000"   # http://localhost:53000
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  pgdata:
  redisdata:
  promdata:
