# Run CounterShift from the image CI publishes to GHCR, with no .NET SDK and no local build:
#
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.ghcr.yml up -d
#
# Layered on top of docker-compose.yml: same services, same settings; only where the API image comes
# from changes. `pull` refreshes :latest; pin a commit with COUNTERSHIFT_TAG=sha-<full commit sha>.
services:
  api:
    image: ghcr.io/kar6677thik/countershift-api:${COUNTERSHIFT_TAG:-latest}
    pull_policy: missing
    build: !reset null
