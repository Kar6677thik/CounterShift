# Continuous integration: every push and pull request must build and pass all tests, and the container
# image must build. Pushes to main also publish the image to GHCR. There is no deploy step (ADR 0015).
# Integration tests use Testcontainers, which needs Docker; GitHub-hosted Ubuntu runners have it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # least privilege: CI only needs to read the code

concurrency:
  # A newer push to the same branch cancels the older, now-irrelevant run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04   # pinned: "latest" moves to Ubuntu 26 on 2026-10-19; upgrade deliberately
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json   # same SDK as local dev

      - name: Restore
        run: dotnet restore CounterShift.slnx

      - name: Build
        run: dotnet build CounterShift.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution CounterShift.slnx -c Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/

  image:
    name: Build container image
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Least privilege per job: only this job may write packages, and it only pushes from main.
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Registry paths must be lowercase; the account name isn't.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/countershift-api" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every push and PR proves the Dockerfile builds. Only main publishes, tagged with the commit
      # (immutable: "exactly this code") and latest (what the Docker-only compose file pulls).
      - name: Build CounterShift.Api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/CounterShift.Api/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=CounterShift API (time-windowed fraud counters with zero-downtime storage migration)
          cache-from: type=gha
          cache-to: type=gha,mode=max
